<title>{{ .Title }} - Abu's Cyber Chronicle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { min-height: 100vh; }
    body {
        font-family: 'Inter', sans-serif;
        background: #0a0e12;
        color: #cbd5e0;
        line-height: 1.7;
        font-weight: 300;
    }
    body::before {
        content: '';
        position: fixed;
        top: 0; left: 0;
        width: 100%; height: 100%;
        background: linear-gradient(transparent 50%, rgba(0, 255, 0, 0.01) 50%);
        background-size: 100% 4px;
        pointer-events: none;
        z-index: 1;
        opacity: 0.3;
    }
    .main-container {
        max-width: 800px;
        margin: 0 auto;
        padding: 0 1rem;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        position: relative;
        z-index: 2;
    }
    .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 1rem 0;
        border-bottom: 1px solid #2d2d2d;
    }
    .logo svg { width: 24px; height: 24px; fill: #fff; }
    .logo:hover svg { opacity: 0.8; }
    .breadcrumb {
        font-family: 'JetBrains Mono', monospace;
        font-size: 0.75rem;
        color: #718096;
    }
    .breadcrumb a { color: #a0aec0; text-decoration: none; }
    .breadcrumb a:hover { color: #fff; }
    .breadcrumb span { margin: 0 0.5rem; color: #4a5568; }
    .content-area {
        flex: 1;
        padding: 3rem 0 2rem;
    }
    h1 {
        font-family: 'JetBrains Mono', monospace;
        font-size: clamp(1.5rem, 4vw, 2rem);
        font-weight: 300;
        color: #f7fafc;
        margin-bottom: 0.75rem;
        letter-spacing: -0.02em;
    }
    .meta {
        font-family: 'JetBrains Mono', monospace;
        font-size: 0.8rem;
        color: #718096;
        margin-bottom: 2.5rem;
        padding-bottom: 2rem;
        border-bottom: 1px solid #2d2d2d;
    }
    .meta a { color: #60a5fa; text-decoration: none; }
    .meta a:hover { text-decoration: underline; }
    .article h2 {
        font-family: 'JetBrains Mono', monospace;
        font-size: 1rem;
        font-weight: 500;
        color: #e2e8f0;
        margin: 2.5rem 0 1rem;
    }
    .article h2:first-child { margin-top: 0; }
    .article h3 {
        font-size: 0.95rem;
        font-weight: 500;
        color: #cbd5e0;
        margin: 1.5rem 0 0.75rem;
    }
    .article p { margin-bottom: 1rem; color: #a0aec0; }
    .article ul, .article ol { padding-left: 1.25rem; margin-bottom: 1rem; color: #a0aec0; }
    .article li { margin-bottom: 0.4rem; }
    .article a { color: #60a5fa; text-decoration: none; }
    .article a:hover { text-decoration: underline; }
    .article strong { color: #cbd5e0; font-weight: 500; }
    .article code { background: #1a1a1a; padding: 0.15rem 0.35rem; border-radius: 3px; font-family: 'JetBrains Mono', monospace; font-size: 0.85em; }
    .article pre { background: #1a1a1a; padding: 1rem; border-radius: 4px; overflow-x: auto; margin: 1rem 0; border: 1px solid #2d2d2d; }
    .article pre code { background: none; padding: 0; }
    .back-nav {
        margin-top: auto;
        padding: 1.5rem 0;
        border-top: 1px solid #2d2d2d;
    }
    .back-link {
        font-family: 'JetBrains Mono', monospace;
        font-size: 0.8rem;
        color: #718096;
        text-decoration: none;
    }
    .back-link:hover { color: #fff; }
    .back-link::before { content: '← '; }

    .logo-image { margin-bottom: 1.5rem; text-align: left; }
    .logo-image img { max-width: 140px; max-height: 50px; object-fit: contain; border-radius: 4px; }
    .featured-image { margin-bottom: 2rem; }
    .featured-image img { max-width: 100%; max-height: 400px; object-fit: contain; border-radius: 8px; cursor: zoom-in; transition: transform 0.2s; }
    .featured-image img:hover { transform: scale(1.02); }
    .image-collage { display: flex; flex-wrap: wrap; justify-content: center; gap: 0.5rem; margin-bottom: 2rem; }
    .image-collage figure { margin: 0; width: calc(25% - 0.375rem); aspect-ratio: 1; border-radius: 4px; overflow: hidden; }
    .image-collage img { width: 100%; height: 100%; object-fit: cover; display: block; border-radius: 4px; }


    .lightbox { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 1000; cursor: zoom-out; }
    .lightbox.active { display: flex; align-items: center; justify-content: center; }
    .lightbox img { max-width: 90%; max-height: 90%; object-fit: contain; border-radius: 8px; }
    .lightbox-close { position: absolute; top: 1rem; right: 1.5rem; color: #fff; font-size: 2rem; cursor: pointer; opacity: 0.7; }
    .lightbox-close:hover { opacity: 1; }
    .image-collage img, .featured-image img { cursor: zoom-in; transition: transform 0.2s; }
    .image-collage img:hover, .featured-image img:hover { transform: scale(1.02); }

    @media (max-width: 600px) {
        .image-collage figure { width: calc(50% - 0.25rem); }
    }
    @media (max-width: 600px) {
        .header { flex-direction: column; gap: 0.75rem; align-items: flex-start; }
        .content-area { padding: 2rem 0; }
    }
